---
- hosts: staging
  become: yes
  tasks:
    - name: Install Apache, PHP, MySQL client, unzip
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - apache2
        - php
        - libapache2-mod-php
        - php-mysql
        - mysql-client
        - unzip

    - name: Copy artifact from Jenkins to server
      copy:
        src: "app-{{ build_number }}.zip"
        dest: "/tmp/app.zip"

    - name: Extract artifact
      unarchive:
        src: "/tmp/app.zip"
        dest: "/var/www/html"
        remote_src: yes

    - name: Move build contents
      command: mv /var/www/html/build/* /var/www/html/

    - name: Import init.sql into MySQL
      mysql_db:
        login_user: root
        login_password: yourpassword
        state: import
        target: /var/www/html/init.sql

    - name: Restart Apache
      service:
        name: apache2
        state: restarted

