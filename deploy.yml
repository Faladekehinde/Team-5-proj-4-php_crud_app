---
- hosts: "{{ target_env }}"
  become: yes
  vars:
    web_root: /var/www/html
    db_user: root
    db_pass: yourpassword   # 👈 set your DB root/admin password
  tasks:
    - name: Install Apache, PHP, MySQL client, unzip
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - apache2
        - php
        - libapache2-mod-php
        - php-mysql
        - mysql-client
        - unzip

    - name: Copy artifact from Jenkins to server
      copy:
        src: "app-{{ build_number }}.zip"
        dest: "/tmp/app.zip"

    - name: Extract artifact
      unarchive:
        src: "/tmp/app.zip"
        dest: "{{ web_root }}"
        remote_src: yes
        extra_opts: [ -o ]   # overwrite existing

    - name: Move build contents
      command: mv {{ web_root }}/build/* {{ web_root }}/

    - name: Import init.sql into MySQL
      mysql_db:
        login_user: "{{ db_user }}"
        login_password: "{{ db_pass }}"
        state: import
        target: "{{ web_root }}/init.sql"

    - name: Restart Apache
      service:
        name: apache2
        state: restarted

